<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32-S3 Global Control</title>
    <!-- مكتبة الاتصال بالسيرفر -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 50px 20px; }
        .card { background: white; padding: 40px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        .btn { display: block; width: 100%; margin: 20px auto; padding: 15px; font-size: 18px; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: bold; }
        .btn-on { background: #2ecc71; box-shadow: 0 4px #27ae60; }
        .btn-on:active { transform: translateY(4px); box-shadow: 0 0; }
        .btn-off { background: #e74c3c; box-shadow: 0 4px #c0392b; }
        .btn-off:active { transform: translateY(4px); box-shadow: 0 0; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: #333;">التحكم بـ ESP32-S3</h2>
    <p style="color: #666;">من أي مكان في العالم</p>
    <button class="btn btn-on" onclick="sendOrder('ON')">تشغيل الإضاءة</button>
    <button class="btn btn-off" onclick="sendOrder('OFF')">إطفاء الإضاءة</button>
</div>

<script>
    // تعديل رابط السيرفر ليعمل بشكل صحيح
var client = new Paho.MQTT.Client("wss://://hivemq.com", "web_client_" + parseInt(Math.random() * 100, 10));
    client.connect({onSuccess:function(){ console.log("Connected to Server"); }});

    function sendOrder(action) {
        var message = new Paho.MQTT.Message(action);
        message.destinationName = "osama094541ctrl/led";
        client.send(message);
    }
</script>

</body>
</html>
