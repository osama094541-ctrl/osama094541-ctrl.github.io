<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم بالذكاء الاصطناعي | Osama AI Dashboard</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --container-bg: #252538;
            --header-bg: #11111b;
            --chat-bg: #181825;
            --primary-color: #a6e3a1;
            --user-bubble: #89b4fa;
            --ai-bubble: #313244;
            --text-color: #cdd6f4;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #45475a;
        }

        .chat-header {
            background-color: var(--header-bg);
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            border-bottom: 1px solid #45475a;
            color: var(--primary-color);
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #a6e3a1;
            border-radius: 50%;
            box-shadow: 0 0 10px #a6e3a1;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--chat-bg);
        }

        .chat-bubble {
            max-width: 75%;
            padding: 14px 20px;
            border-radius: 15px;
            font-size: 16px;
            line-height: 1.6;
            text-align: right;
            direction: rtl;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user-bubble {
            background-color: var(--user-bubble);
            align-self: flex-start;
            color: #11111b;
            border-bottom-right-radius: 0;
            font-weight: 500;
        }

        .ai-bubble {
            background-color: var(--ai-bubble);
            align-self: flex-end;
            color: var(--text-color);
            border-bottom-left-radius: 0;
            border: 1px solid #45475a;
        }

        .chat-footer {
            background-color: var(--header-bg);
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #45475a;
        }

        input[type=text] {
            flex: 1;
            padding: 15px;
            background-color: #313244;
            border: 1px solid #45475a;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            text-align: right;
            direction: rtl;
            outline: none;
            transition: border 0.2s;
        }

        input[type=text]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 0 30px;
            background-color: var(--primary-color);
            color: #11111b;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background-color: #94e2d5;
            transform: scale(1.02);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="chat-header">
        <div class="status-dot"></div>
        Osama AI Cloud Dashboard v4.5 🚀
    </div>
    <div class="chat-body" id="chatBody">
        <div class="chat-bubble ai-bubble" id="welcomeBubble">
            مرحباً بك في لوحة تحكمك العالمية! المنظومة متصلة بالسحاب عتادياً الآن. اسألني عن أي موضوع في التاريخ أو العلوم، وسأقوم بمعالجته عبر الـ S3 ونطقه صوتياً فوراً!
        </div>
    </div>
    <div class="chat-footer">
        <input type="text" id="userInput" placeholder="اسأل ذكاء السحاب الحين..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    // دالة نطق النصوص باللغة العربية (Text-to-Speech)
    function speakText(text) {
        // تنظيف النص من أكواد الـ HTML لكي لا ينطقها المتصفح بالخطأ
        var cleanText = text.replace(/<[^>]*>/g, '');
        
        if ('speechSynthesis' in window) {
            var utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ar-SA'; // ضبط اللهجة العربية القياسية
            utterance.pitch = 1.0;
            utterance.rate = 1.0; // السرعة الافتراضية للحديث
            window.speechSynthesis.speak(utterance);
        }
    }

    // دالة محاكاة الآلة الكاتبة لطباعة الرد حرفاً بحرف (Typing Effect)
    function typeEffect(element, text, speed, callback) {
        let i = 0;
        element.innerHTML = "<b>S3 Brain: </b>";
        
        function typing() {
            if (i < text.length) {
                // إذا واجه النص علامة كسر السطر المجهزة من الشريحة <br>
                if (text.substr(i, 4) === "<br>") {
                    element.innerHTML += "<br>";
                    i += 4;
                } else {
                    element.innerHTML += text.charAt(i);
                    i++;
                }
                document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
                setTimeout(typing, speed);
            } else {
                if(callback) callback();
            }
        }
        typing();
    }

    function sendMessage() {
        var input = document.getElementById('userInput');
        var text = input.value.trim();
        if (!text) return;

        var body = document.getElementById('chatBody');
        
        // 1. عرض رسالة المستخدم الفورية
        body.innerHTML += '<div class="chat-bubble user-bubble">' + text + '</div>';
        body.scrollTop = body.scrollHeight;
        input.value = '';

        // 2. إنشاء فقرة الرد الفارغة المجهزة لاستقبال حركات الآلة الكاتبة
        var aiBubbleId = 'ai_' + Date.now();
        body.innerHTML += '<div class="chat-bubble ai-bubble" id="' + aiBubbleId + '"><b>S3 Brain:</b> جاري عبور النبضات الفكرية للسحاب...</div>';
        body.scrollTop = body.scrollHeight;

        // 3. الاتصال المباشر بعنوان الـ IP الخاص بالشريحة المتصلة بالسحاب
        fetch('http://192.168.1' + encodeURIComponent(text))
        .then(res => res.text())
        .then(data => {
            var aiBubble = document.getElementById(aiBubbleId);
            
            // تفعيل تأثير الكتابة التفاعلي وتمرير دالة النطق الصوتي التلقائي بمجرد اكتمال السطر
            typeEffect(aiBubble, data, 25, function() {
                speakText(data); // الهاتف يتحدث بالرد العربي فوراً!
            });
        })
        .catch(err => {
            var aiBubble = document.getElementById(aiBubbleId);
            aiBubble.style.borderColor = "#f38ba8";
            aiBubble.style.color = "#f38ba8";
            aiBubble.innerHTML = "<b>خطأ اتصال:</b> الشريحة لم تستجب. تأكد من اتصال الآيفون بشبكة الواي فاي <b>ESP32S3_Real_AI</b> أولاً!";
            speakText("حدث خطأ في الاتصال، يرجى التحقق من الشبكة");
        });
    }
</script>

</body>
</html>
